name: Automated QA Test Suite & Security Checks

on:
  push:
    branches: [ main, alpha ]
  pull_request:
    branches: [ main, alpha ]

env:
  SECRET_KEY: 'ci-testing-secret-key-32-chars-long-hendaxis-trust-ci-test'
  DEBUG: 'True'
  DJANGO_SETTINGS_MODULE: 'hendaxis_trust.settings'
  REDIS_URL: 'redis://127.0.0.1:6379/0'
  CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
  CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'

jobs:
  backend-tests:
    name: Backend Pytest & Django Checks
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Verify Redis Connection
        run: |
          cd backend
          python -c "import redis; r = redis.Redis.from_url('redis://127.0.0.1:6379/0'); r.ping(); print('Redis is healthy and reachable')"

      - name: Run Django System Check
        run: |
          cd backend
          python manage.py check

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest --tb=short

  frontend-tests:
    name: Frontend TypeScript & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run TypeScript & Production Build Check
        run: |
          cd frontend
          npm run build

      - name: Run Vitest Component & Unit Tests
        run: |
          cd frontend
          npm test

  e2e-tests:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E & Frontend Dependencies
        run: |
          cd frontend && (npm ci || npm install)
          cd ../e2e && (npm ci || npm install)
          npx playwright install --with-deps chromium

      - name: Start Backend & Frontend Servers
        run: |
          cd backend
          python manage.py migrate
          python manage.py runserver 8000 > /tmp/backend.log 2>&1 &

          cd ../frontend
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &

          for i in {1..30}; do
            if curl -k --fail --silent https://127.0.0.1:5173/ > /dev/null; then
              echo "Frontend is ready at https://127.0.0.1:5173!"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Frontend did not become ready in 30 seconds"
              cat /tmp/frontend.log
              exit 1
            fi

            sleep 1
          done

      - name: Run Playwright E2E Tests
        run: |
          cd e2e
          npx playwright test
