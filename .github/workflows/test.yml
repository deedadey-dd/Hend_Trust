name: Automated QA Test Suite & Security Checks

on:
  push:
    branches: [ main, alpha ]
  pull_request:
    branches: [ main, alpha ]

jobs:
  backend-tests:
    name: Backend Pytest & Django Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Django System Check
        run: |
          cd backend
          python manage.py check

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: 'ci-testing-secret-key-must-be-secure-in-prod'
          DEBUG: 'True'
        run: |
          cd backend
          pytest --tb=short

  frontend-tests:
    name: Frontend TypeScript & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run TypeScript & Production Build Check
        run: |
          cd frontend
          npm run build

      - name: Run Vitest Component & Unit Tests
        run: |
          cd frontend
          npm test

  e2e-tests:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies & Playwright Browsers
        run: |
          cd e2e
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Build Frontend & Start Servers
        run: |
          cd frontend && npm install && npm run build &
          cd backend && python manage.py runserver &

      - name: Run Playwright E2E Tests
        run: |
          cd e2e
          npx playwright test
