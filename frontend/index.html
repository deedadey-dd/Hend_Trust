<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>HendAxis Trust — Ghana's Buyer-Seller Escrow Payment Platform</title>
    <meta name="title" content="HendAxis Trust — Ghana's Buyer-Seller Escrow Payment Platform" />
    <meta name="description" content="Pay securely, sell with confidence. HendAxis Trust protects online transactions across Ghana with double-entry escrow, MoMo & card integration, formal courier webhooks, and verified seller badges." />
    <meta name="keywords" content="escrow Ghana, secure payments Ghana, buyer protection Ghana, seller verification, Mobile Money escrow, MoMo escrow, online shopping security, HendAxis Trust" />
    <meta name="author" content="HendAxis Trust Limited" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://trust.hendaxis.com/" />

    <!-- Google Search Console Verification (Replace with your actual GSC verification code) -->
     
    <meta name="google-site-verification" content="uYsrSnVRn5g_hb-xUwsupf1x7A38oKqBQm1XixO11kE" /> 

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trust.hendaxis.com/" />
    <meta property="og:title" content="HendAxis Trust — Ghana's Buyer-Seller Escrow Payment Platform" />
    <meta property="og:description" content="Protecting online commerce in Ghana with double-entry escrow, verified seller storefronts, and instant MoMo payouts." />
    <meta property="og:image" content="https://trust.hendaxis.com/assets/hero_banner.jpg" />
    <meta property="og:site_name" content="HendAxis Trust" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trust.hendaxis.com/" />
    <meta name="twitter:title" content="HendAxis Trust — Ghana's Buyer-Seller Escrow Payment Platform" />
    <meta name="twitter:description" content="Protecting online commerce in Ghana with double-entry escrow, verified seller storefronts, and instant MoMo payouts." />
    <!-- Critical Pre-hydration & SEO Crawler Styles -->
    <style>
      .seo-crawler-content {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      .app-pre-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
      }
      .app-pre-spinner {
        width: 38px;
        height: 38px;
        border: 3.5px solid rgba(3, 99, 255, 0.18);
        border-top-color: #0363ff;
        border-radius: 50%;
        animation: spin-pre 0.75s linear infinite;
      }
      @keyframes spin-pre {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased transition-colors min-h-screen">
    <div id="root">
      <div class="app-pre-loader">
        <div class="app-pre-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
