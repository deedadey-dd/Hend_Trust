version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hendaxis_trust_db
      POSTGRES_USER: hendaxis_user
      POSTGRES_PASSWORD: hendaxis_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://hendaxis_user:hendaxis_pass@db:5432/hendaxis_trust_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && celery -A hendaxis_trust.celery worker -l info"
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgres://hendaxis_user:hendaxis_pass@db:5432/hendaxis_trust_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
